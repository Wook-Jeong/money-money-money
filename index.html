<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f5f5f5" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Money! Money! Money!" />
  <title>Money! Money! Money!</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="app-shell">
    <header class="app-header">
      <div>
        <h1>Money! Money! Money!</h1>
        <p id="data-status" class="data-status" aria-live="polite">데이터 확인 중...</p>
      </div>
      <button id="reset-button" class="reset-button" type="button" aria-label="생성 결과와 선택 초기화" title="처음 화면으로 초기화">
        <span aria-hidden="true">↺</span> 초기화
      </button>
    </header>

    <div class="desktop-grid">
      <section class="panel generator-panel" aria-labelledby="generator-title">
        <h2 id="generator-title">번호를 어떻게 뽑을까요?</h2>

        <div class="method-list">
          <label class="method-card">
            <input type="checkbox" name="method" value="hot" />
            <span>
              <strong>Hot</strong>
              <small>최근 50회 · Hot 번호 4개 + 나머지 2개</small>
            </span>
          </label>

          <label class="method-card">
            <input type="checkbox" name="method" value="hotCold" />
            <span>
              <strong>Hot + Cold</strong>
              <small>최근 50회 · Hot 3개 + Cold 3개</small>
            </span>
          </label>

          <label class="method-card">
            <input type="checkbox" name="method" value="recent100" />
            <span>
              <strong>Recent 100</strong>
              <small>최근 100회 · 출현 빈도 가중 추출</small>
            </span>
          </label>

          <label class="method-card">
            <input type="checkbox" name="method" value="balanced" />
            <span>
              <strong>Balanced</strong>
              <small>홀짝 · 저/고 · 합계 · 번호대 균형</small>
            </span>
          </label>

          <label class="method-card">
            <input type="checkbox" name="method" value="random" />
            <span>
              <strong>Random</strong>
              <small>1~45 완전 무작위</small>
            </span>
          </label>
        </div>

        <div class="generate-area">
          <p id="selected-count">선택된 게임: 0게임</p>
          <button id="generate-button" class="primary-button" type="button" disabled>
            게임을 선택해주세요
          </button>
        </div>
      </section>

      <section class="panel result-panel" aria-labelledby="result-title">
        <h2 id="result-title">생성 결과</h2>
        <div id="empty-result" class="empty-result">번호를 생성하면 여기에 표시됩니다.</div>
        <div id="result-list" class="result-list"></div>
      </section>
    </div>
  </main>

  <template id="game-template">
    <article class="game-card">
      <div class="game-head">
        <strong class="game-title"></strong>
        <button class="refresh-button" type="button" aria-label="이 게임 다시 생성" title="이 게임 다시 생성">↻</button>
      </div>
      <div class="number-row" aria-label="생성 번호"></div>
      <details class="game-details">
        <summary>어떻게 생성됐나요?</summary>
        <div class="detail-content"></div>
      </details>
    </article>
  </template>

  <script src="./app.js" defer></script>
</body>
</html>
